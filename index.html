<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notación Polaca</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10">
        <div class="card text-center p-4 shadow-sm">

          <h1 class="fw-bold mb-4 text-white">Notación Polaca</h1>

          <div class="card-body">
            <div class="mb-4">
              <label class="fw-bold mb-2 d-block text-white">Ingresa Notación Normal</label>
              <input id="normal" type="text" class="form-control" placeholder="Ejemplo: 3+5*(2-1)">
            </div>
            <div class="mb-4">
              <label class="fw-bold mb-2 d-block text-white">Ingresa Notación Polaca</label>
              <input id="polaca" type="text" class="form-control" placeholder="Ejemplo: + 3 * 5 2">
            </div>
            <div class="mb-4">
              <button id="btn_resolver" class="btn btn-outline-dark w-50">Generar</button>
            </div>
            <div class="mb-4">
              <button id="btn_guardar" class="btn btn-outline-dark w-50">Almacenar</button>
            </div>
            <div class="mb-4">
              <label class="fw-bold mb-2 text-white d-block">Almacenados</label>
              <div id="almacenados" class="form-control" style="min-height: 100px;"></div>
            </div>
            <div class="mb-4">
              <label class="fw-bold mb-2">Resultado</label>
              <input id="resultado" type="text" class="form-control w-50 mx-auto" readonly placeholder="Resultado en tiempo real">
            </div>
            <div class="mb-3">
              <button id="btn_limpiar" class="btn btn-outline-dark w-50">Limpiar</button>
            </div>
          </div>
        </div> 
      </div>
    </div>
  </div>

  <script src="./bundle.js"></script>
</body>
</html>
